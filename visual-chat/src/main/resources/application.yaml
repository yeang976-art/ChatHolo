spring:
  application:
    name: visual-chat

  datasource:
    url: jdbc:mysql://localhost:3306/visual_chat
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true